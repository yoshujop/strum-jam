<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Funk drummer preview</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #2d1b4e; font-family: system-ui, sans-serif; color: #fff; }
  .stage { width: min(90vw, 460px); }
  .stage svg, .stage object { width: 100%; height: auto; display: block; }
  .controls { display: flex; gap: .75rem; justify-content: center; align-items: center; margin-top: 1rem; }
  button { font: inherit; padding: .5rem 1rem; border-radius: 999px; border: 3px solid #2b1a12; background: #ffd23f; cursor: pointer; }
  input { width: 5rem; font: inherit; }
</style>
</head>
<body>
<div>
  <div class="stage"><object id="drummer" data="funk_drummer.svg" type="image/svg+xml" aria-label="Animated funk drummer"></object></div>
  <div class="controls">
    <button id="toggle">Pause</button>
    <label>BPM <input id="bpm" type="number" value="120" min="40" max="240"></label>
  </div>
</div>
<script>
  const obj = document.getElementById('drummer');
  const anims = () => obj.contentDocument ? obj.contentDocument.getAnimations() : [];
  let playing = true;
  document.getElementById('toggle').onclick = e => {
    playing = !playing;
    anims().forEach(a => playing ? a.play() : a.pause());
    e.target.textContent = playing ? 'Pause' : 'Play';
  };
  document.getElementById('bpm').oninput = e => {
    const bpm = Math.max(40, Math.min(240, +e.target.value || 120));
    anims().forEach(a => { if (a.effect.getTiming().duration === 4000) a.playbackRate = bpm / 120; });
  };
</script>
</body>
</html>
